name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create a GitHub Release + upload the tarball asset on tags
  packages: write # push the image to ghcr.io

env:
  # Real floor is 1.19/OTP 28, not the `~> 1.17` in mix.exs — config/runtime.exs uses the
  # `E` (:export) regex sigil modifier, which doesn't exist before Elixir 1.19/OTP 28 (see
  # Containerfile). Testing on anything older would pass while shipping an unbootable release.
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/family_dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: loose

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-test-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      # The `test` alias runs `ash.setup --quiet` first (create+migrate+seed the SQLite
      # test DB) — exqlite statically compiles SQLite into its NIF, so no DB service
      # container is needed here.
      - run: mix test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: loose

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-

      - run: mix deps.get
      - run: mix format --check-formatted
      # CI-safe form of the `precommit` alias's `deps.unlock --unused` — reports unused
      # lockfile entries without rewriting mix.lock out from under the commit.
      - run: mix deps.unlock --check-unused

  # Builds each platform natively (no QEMU emulation) — the kiosk fleet includes arm64
  # hardware (a Raspberry Pi), and this repo is public, so GitHub's free-tier native
  # arm64 runners (ubuntu-24.04-arm) are available. On push/tag events each leg pushes
  # its image by digest only (no tag yet); the `publish` job below merges both digests
  # into one multi-platform manifest list under the real tags. On PRs nothing is pushed —
  # each leg just validates the Containerfile builds on its own platform.
  build:
    name: build (${{ matrix.platform }})
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.suffix }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || 'type=cacheonly' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merges the per-platform digests from `build` into a single multi-platform manifest
  # list under the real tags (latest/sha/version), then publishes the release tarball.
  # Only runs on push/tag events — PRs stop after `build` since there's nothing to merge.
  publish:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect pushed manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # Release tarball: extracted from the image we just pushed (docker cp), rather than
      # a second `mix release`, so the download can never drift from what the container
      # ships. Pin --platform so this always extracts the amd64 variant from the (now
      # multi-platform) tag, regardless of the runner's own architecture — the ERTS
      # binaries bundled in the release are architecture-specific.
      - name: Extract release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker create --name rel --platform linux/amd64 "${IMAGE_NAME}:${REF_NAME}"
          mkdir -p release-out
          docker cp rel:/app/. release-out/
          docker rm rel
          tar -C release-out -czf "family_dashboard-${REF_NAME}-linux-x86_64.tar.gz" .

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: family_dashboard-*.tar.gz
